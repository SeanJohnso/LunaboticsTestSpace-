/**:
  ros__parameters:
    serial: ""                 # T265 serial number; empty = first T265 found
    odom_frame: odom
    base_frame: t265_link      # T265 pose frame, ROS axes (x forward, y left, z up)
    publish_tf: true           # odom -> base_frame; turn off when another node (e.g. robot_localization) owns it
    enable_imu: false          # imu/gyro (200 Hz) and imu/accel (62.5 Hz), sensor_msgs/Imu in base_frame
    enable_fisheye: false      # fisheye{1,2}/image_raw + camera_info, 848x800 mono8 at 30 Hz (heavy over Wi-Fi)
    pose_covariance: 0.01      # base variance, scaled by 10^(3 - tracker_confidence)
    twist_covariance: 0.01     # base variance, scaled by 10^(1 - tracker_confidence)
